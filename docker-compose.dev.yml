# Инфраструктура для локальной разработки.
# Приложения (api/web) запускаются на хосте через `pnpm dev`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: schedule-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: schedule
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 5432 на хосте часто занят локальным Postgres, поэтому пробрасываем 5433
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d schedule']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
